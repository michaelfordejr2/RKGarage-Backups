<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - R&K AUTO GARAGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="portal.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1E3A34; --secondary: #2C5E55; --bg: #EDF2F4; }
        [x-cloak] { display: none !important; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: #333; }
        .sidebar { width: 260px; background: var(--primary); color: #ccc; position: fixed; height: 100vh; display: flex; flex-direction: column; }
        .main-content { margin-left: 260px; padding: 2rem; min-height: 100vh; }
        .nav-link { padding: 12px 24px; display: flex; align-items: center; gap: 12px; transition: 0.2s; cursor: pointer; color: #ccc; text-decoration: none; }
        .nav-link:hover { background: var(--secondary); color: white; }
        .nav-link.active { background: var(--secondary); color: white; border-left: 4px solid #81C784; }
    </style>
</head>
<body class="flex" x-data="getInventoryApp()" x-init="init()">
    <aside class="sidebar z-50">
        <div class="p-8 border-b border-white/10">
            <h1 class="text-xl font-black text-white tracking-tighter">R&K <span class="text-green-400">AUTO</span></h1>
        </div>
        <nav class="flex-1 mt-4">
            <a href="index.html" class="nav-link">Dashboard</a>
            <a href="garage.html" class="nav-link">Garage</a>
            <a href="inventory.html" class="nav-link active">Inventory</a>
            <a href="billing.html" class="nav-link">Billing</a>
            <a href="analytics.html" class="nav-link">Analytics</a>
            <a href="printing.html" class="nav-link">Job Cards</a>
        </nav>
        <div class="p-6 border-t border-white/10 space-y-2 text-xs font-bold uppercase tracking-widest text-center">
            <button x-show="!isAdmin" @click="promptAdmin()" class="w-full bg-white/10 p-3 rounded-lg hover:bg-white/20 transition text-white">Admin Access</button>
            <button x-show="isAdmin" @click="logout()" class="w-full bg-red-900/40 p-3 rounded-lg hover:bg-red-900/60 transition text-white">Exit Session</button>
        </div>
    </aside>

    <main class="main-content flex-1">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-3xl font-black text-[#1E3A34] tracking-tight">Parts & Spares</h2>
                <p class="text-gray-400 text-sm font-bold uppercase tracking-wider" x-text="status"></p>
            </div>
        </header>

        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 text-[10px] font-black text-gray-400 uppercase tracking-widest">
                        <tr>
                            <template x-for="col in columns"><th class="p-6 border-b" x-text="col"></th></template>
                            <th class="p-6 border-b" x-show="isAdmin" x-cloak>Actions</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm font-medium">
                        <template x-for="row in rows">
                            <tr class="hover:bg-gray-50/50 transition border-b">
                                <template x-for="val in row"><td class="p-6" x-text="val || '-'"></td></template>
                                <td class="p-6 text-right" x-show="isAdmin" x-cloak>
                                    <button @click="editRow(row)" class="text-blue-600 font-bold hover:underline">Edit</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Edit Modal -->
    <div x-show="showEditModal" x-cloak class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
        <div class="bg-white rounded-[32px] p-10 w-full max-w-lg shadow-2xl">
            <h3 class="text-2xl font-black mb-8">Update Part</h3>
            <div class="space-y-4 max-h-[50vh] overflow-y-auto pr-2">
                <template x-for="(col, index) in columns">
                    <div>
                        <label class="text-[10px] font-black text-gray-400 uppercase mb-2 block" x-text="col"></label>
                        <input type="text" x-model="editingRow[index]" :disabled="col === 'id'" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-[#2C5E55] outline-none transition font-bold">
                    </div>
                </template>
            </div>
            <div class="flex gap-4 mt-10">
                <button @click="showEditModal = false" class="flex-1 p-4 rounded-2xl font-black bg-gray-100 text-gray-400 hover:bg-gray-200 transition">Cancel</button>
                <button @click="saveEntry()" class="flex-1 p-4 rounded-2xl font-black bg-[#1E3A34] text-white shadow-lg hover:bg-[#2C5E55] transition">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        function getInventoryApp() {
            const shared = getPortalApp();
            return {
                ...shared,
                columns: [], rows: [],
                showEditModal: false, editingRow: [],

                async init() {
                    await this.initShared();
                    this.loadTable();
                },

                loadTable() {
                    if (!this.db) return setTimeout(() => this.loadTable(), 500);
                    const data = this.db.exec("SELECT * FROM parts ORDER BY id DESC");
                    this.columns = data[0].columns;
                    this.rows = data[0].values;
                },

                editRow(row) { this.editingRow = [...row]; this.showEditModal = true; },

                async saveEntry() {
                    let sets = []; this.columns.forEach((col, i) => { if(col !== 'id') sets.push(col + " = ?"); });
                    const vals = this.editingRow.filter((_, i) => this.columns[i] !== 'id');
                    const id = this.editingRow[this.columns.indexOf('id')];
                    try {
                        this.db.run("UPDATE parts SET " + sets.join(', ') + " WHERE id = ?", [...vals, id]);
                        if (await this.syncCloud()) { this.showEditModal = false; this.loadTable(); }
                    } catch(e) { alert(e.message); }
                }
            }
        }
    </script>
</body>
</html>
