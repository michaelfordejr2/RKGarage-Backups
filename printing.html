<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Cards - R&K AUTO GARAGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="portal.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1E3A34; --secondary: #2C5E55; --bg: #EDF2F4; }
        [x-cloak] { display: none !important; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: #333; }
        .sidebar { width: 260px; background: var(--primary); color: #ccc; position: fixed; height: 100vh; display: flex; flex-direction: column; }
        .main-content { margin-left: 260px; padding: 2rem; min-height: 100vh; }
        .nav-link { padding: 12px 24px; display: flex; align-items: center; gap: 12px; transition: 0.2s; cursor: pointer; color: #ccc; text-decoration: none; }
        .nav-link:hover { background: var(--secondary); color: white; }
        .nav-link.active { background: var(--secondary); color: white; border-left: 4px solid #81C784; }
        @media print {
            .no-print { display: none !important; }
            .main-content { margin-left: 0 !important; padding: 0 !important; }
            .print-only { display: block !important; }
        }
    </style>
</head>
<body class="flex" x-data="getPrintingApp()" x-init="init()">
    <aside class="sidebar z-50 no-print">
        <div class="p-8 border-b border-white/10">
            <h1 class="text-xl font-black text-white tracking-tighter">R&K <span class="text-green-400">AUTO</span></h1>
        </div>
        <nav class="flex-1 mt-4">
            <a href="index.html" class="nav-link">Dashboard</a>
            <a href="garage.html" class="nav-link">Garage</a>
            <a href="inventory.html" class="nav-link">Inventory</a>
            <a href="billing.html" class="nav-link">Billing</a>
            <a href="analytics.html" class="nav-link">Analytics</a>
            <a href="printing.html" class="nav-link active">Job Cards</a>
        </nav>
        <div class="p-6 border-t border-white/10 space-y-2 text-xs font-bold uppercase tracking-widest text-center">
            <button x-show="!isAdmin" @click="promptAdmin()" class="w-full bg-white/10 p-3 rounded-lg hover:bg-white/20 transition text-white">Admin Access</button>
            <button x-show="isAdmin" @click="logout()" class="w-full bg-red-900/40 p-3 rounded-lg hover:bg-red-900/60 transition text-white">Exit Session</button>
        </div>
    </aside>

    <main class="main-content flex-1">
        <header class="flex justify-between items-center mb-10 no-print">
            <div>
                <h2 class="text-3xl font-black text-[#1E3A34] tracking-tight">Production & Printing</h2>
                <p class="text-gray-400 text-sm font-bold uppercase tracking-wider" x-text="status"></p>
            </div>
        </header>

        <div class="no-print max-w-4xl">
            <div class="bg-white rounded-3xl p-8 border border-gray-100 shadow-sm">
                <h3 class="text-xl font-black mb-6">Generate Workshop Job Card</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div>
                        <label class="text-[10px] font-black text-gray-400 uppercase mb-2 block">Select Vehicle</label>
                        <select x-model="selectedJobVehicle" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none">
                            <option value="">Choose Vehicle...</option>
                            <template x-for="v in garageList" :key="v.id">
                                <option :value="JSON.stringify(v)" x-text="v.regPlate + ' - ' + v.make + ' ' + v.model"></option>
                            </template>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-gray-400 uppercase mb-2 block">Technician</label>
                        <input type="text" x-model="printMechanic" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none" placeholder="Assigned to...">
                    </div>
                </div>
                <button @click="printJobCard()" class="bg-[#1E3A34] text-white px-8 py-4 rounded-2xl font-black shadow-lg hover:bg-[#2C5E55] transition">Print Professional Job Card</button>
            </div>
        </div>

        <!-- Print Template -->
        <div id="print-area" class="hidden print-only p-10 bg-white min-h-screen">
            <div class="border-4 border-black p-8">
                <div class="flex justify-between items-start border-b-4 border-black pb-6 mb-8">
                    <div>
                        <h1 class="text-4xl font-black mb-1 uppercase" x-text="workshopName"></h1>
                        <p class="text-xl font-bold uppercase tracking-widest">Workshop Job Card</p>
                    </div>
                    <div class="text-right">
                        <p class="font-black text-2xl" x-text="new Date().toLocaleDateString('en-GB')"></p>
                        <p class="text-sm font-bold uppercase">Work Authorization</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-10 mb-10">
                    <div class="space-y-4">
                        <h2 class="text-xs font-black uppercase bg-black text-white px-2 py-1 inline-block">Vehicle Details</h2>
                        <p class="text-2xl font-black" x-text="printData.vehicle?.regPlate || 'N/A'"></p>
                        <p class="text-lg font-bold" x-text="(printData.vehicle?.make || '') + ' ' + (printData.vehicle?.model || '')"></p>
                        <p class="text-sm">VIN: <span class="font-bold" x-text="printData.vehicle?.vin || 'N/A'"></span></p>
                    </div>
                    <div class="space-y-4 text-right">
                        <h2 class="text-xs font-black uppercase bg-black text-white px-2 py-1 inline-block">Assignment</h2>
                        <p class="text-xl font-black" x-text="printMechanic || 'UNASSIGNED'"></p>
                        <p class="text-sm">Customer: <span class="font-bold" x-text="printData.vehicle?.ownerNameDisplay || 'WALK-IN'"></span></p>
                    </div>
                </div>

                <div class="border-t-2 border-black pt-8 mb-10">
                    <h2 class="text-xs font-black uppercase mb-4">Inspection & Fault Notes</h2>
                    <div class="h-48 border-2 border-gray-200 rounded-lg"></div>
                </div>

                <div class="border-t-2 border-black pt-8 mb-10">
                    <h2 class="text-xs font-black uppercase mb-4">Parts & Materials Used</h2>
                    <div class="h-48 border-2 border-gray-200 rounded-lg"></div>
                </div>

                <div class="grid grid-cols-2 gap-10 border-t-4 border-black pt-8">
                    <div class="space-y-2">
                        <p class="text-[10px] font-bold uppercase">Technician Signature</p>
                        <div class="h-16 border-b-2 border-black"></div>
                    </div>
                    <div class="space-y-2">
                        <p class="text-[10px] font-bold uppercase">Quality Control Check</p>
                        <div class="h-16 border-b-2 border-black"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function getPrintingApp() {
            const shared = getPortalApp();
            return {
                ...shared,
                selectedJobVehicle: '', printMechanic: '',
                printData: { vehicle: null },

                async init() {
                    await this.initShared();
                },

                printJobCard() {
                    if (!this.selectedJobVehicle) return alert('Please select a vehicle first.');
                    this.printData.vehicle = JSON.parse(this.selectedJobVehicle);
                    setTimeout(() => window.print(), 200);
                }
            }
        }
    </script>
</body>
</html>
